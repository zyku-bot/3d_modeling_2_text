      import React, {

      import {
        ArrowDownToLine,
        Box,
        Camera,

      const html = htm.bind(React.createElement);
      const API_BASE = ''; // 필요 시 백엔드 URL 지정 (예: 'https://your-server.example.com')

      const DEG2RAD = Math.PI / 180;
      const RAD2DEG = 180 / Math.PI;

      // =========================================================================
      // 1. IndexedDB Storage (Projects + Imported 3D Assets)
      // =========================================================================
      const DB_NAME = 'vocacad_studio_db';
      const DB_VERSION = 1;
      const PROJECTS_STORE = 'projects';
      const ASSETS_STORE = 'assets';
      const assetMemoryCache = new Map();

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(PROJECTS_STORE)) {
              const store = db.createObjectStore(PROJECTS_STORE, { keyPath: 'id' });
              store.createIndex('updatedAt', 'updatedAt', { unique: false });
            }
            if (!db.objectStoreNames.contains(ASSETS_STORE)) {
              db.createObjectStore(ASSETS_STORE, { keyPath: 'id' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function listProjects() {
        try {
          const db = await openDB();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(PROJECTS_STORE, 'readonly');
            const req = tx.objectStore(PROJECTS_STORE).getAll();
            req.onsuccess = () => {
              const items = req.result || [];
              items.sort((a, b) => b.updatedAt - a.updatedAt);
              resolve(items);
            };
            req.onerror = () => reject(req.error);
          });
        } catch {
          return [];
        }
      }

      async function saveStoredProject(record) {
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(PROJECTS_STORE, 'readwrite');
          tx.objectStore(PROJECTS_STORE).put(record);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function deleteStoredProject(id) {
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(PROJECTS_STORE, 'readwrite');
          tx.objectStore(PROJECTS_STORE).delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function saveAssetRecord(asset) {
        assetMemoryCache.set(asset.id, asset);
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(ASSETS_STORE, 'readwrite');
          tx.objectStore(ASSETS_STORE).put(asset);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function getAssetRecord(id) {
        if (assetMemoryCache.has(id)) return assetMemoryCache.get(id);
        try {
          const db = await openDB();
          const record = await new Promise((resolve, reject) => {
            const tx = db.transaction(ASSETS_STORE, 'readonly');
            const req = tx.objectStore(ASSETS_STORE).get(id);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => reject(req.error);
          });
          if (record) assetMemoryCache.set(id, record);
          return record;
        } catch {
          return null;
        }
      }

      // =========================================================================
      // 2. Procedural Canvas Textures & 3D Geometry / Material Builders
      // =========================================================================
      let cachedWoodAlbedo = null;
      let cachedBrushedRoughness = null;
      let cachedContactShadow = null;

      function getWoodAlbedoTexture(maxAnisotropy = 4) {
        if (cachedWoodAlbedo) return cachedWoodAlbedo;
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.fillStyle = '#d4a373';
          ctx.fillRect(0, 0, 512, 512);
          for (let y = 0; y < 512; y += 2) {
            const wave = Math.sin(y * 0.04) * 14 + Math.cos(y * 0.013) * 8;
            const tone = 188 + Math.round(Math.sin((y + wave) * 0.11) * 18);
            ctx.fillStyle = `rgb(${tone}, ${Math.round(tone * 0.72)}, ${Math.round(tone * 0.46)})`;
            ctx.fillRect(0, y, 512, 2);
          }
          ctx.globalAlpha = 0.08;
          for (let i = 0; i < 650; i++) {
            const x = (i * 73) % 512;
            const y = (i * 197) % 512;
            ctx.fillStyle = i % 2 === 0 ? '#5c3a21' : '#f3d5b5';
            ctx.fillRect(x, y, 28 + (i % 40), 1);
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 2);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = maxAnisotropy;
        cachedWoodAlbedo = tex;
        return tex;
      }

      function getBrushedRoughnessTexture(maxAnisotropy = 4) {
        if (cachedBrushedRoughness) return cachedBrushedRoughness;
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.fillStyle = '#505050';
          ctx.fillRect(0, 0, 256, 256);
          for (let i = 0; i < 900; i++) {
            const y = (i * 37) % 256;
            const v = 55 + ((i * 19) % 70);
            ctx.fillStyle = `rgb(${v},${v},${v})`;
            ctx.fillRect(0, y, 256, 1);
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(3, 3);
        tex.colorSpace = THREE.NoColorSpace;
        tex.anisotropy = maxAnisotropy;
        cachedBrushedRoughness = tex;
        return tex;
      }

      function getContactShadowTexture() {
        if (cachedContactShadow) return cachedContactShadow;
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        if (ctx) {
          const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 124);
          grad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
          grad.addColorStop(0.45, 'rgba(0, 0, 0, 0.22)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 256, 256);
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        cachedContactShadow = tex;
        return tex;
      }

      function createPBRMaterial(spec, isSoftwareGl, maxAnisotropy = 4) {
        const baseColor = new THREE.Color(spec?.color || '#94a3b8');
        const finish = spec?.finish || 'satin';

        if (finish === 'glass') {
          return new THREE.MeshPhysicalMaterial({
            color: baseColor,
            roughness: spec.roughness ?? 0.06,
            metalness: spec.metalness ?? 0.0,
            ior: 1.52,
            thickness: 0.6,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05,
            transmission: isSoftwareGl ? 0 : 0.9,
            transparent: true,
            opacity: isSoftwareGl ? Math.min(spec.opacity ?? 0.42, 0.5) : spec.opacity ?? 1.0,
            depthWrite: !isSoftwareGl,
          });
        }
        if (finish === 'brushed_metal') {
          return new THREE.MeshPhysicalMaterial({
            color: baseColor,
            metalness: spec.metalness ?? 0.94,
            roughness: spec.roughness ?? 0.26,
            roughnessMap: getBrushedRoughnessTexture(maxAnisotropy),
            anisotropy: 0.85,
            anisotropyRotation: 0.2,
            transparent: (spec.opacity ?? 1) < 1,
            opacity: spec.opacity ?? 1,
          });
        }
        if (finish === 'ceramic') {
          return new THREE.MeshPhysicalMaterial({
            color: baseColor,
            metalness: spec.metalness ?? 0.0,
            roughness: spec.roughness ?? 0.22,
            clearcoat: 0.92,
            clearcoatRoughness: 0.08,
            transparent: (spec.opacity ?? 1) < 1,
            opacity: spec.opacity ?? 1,
          });
        }
        if (finish === 'wood') {
          return new THREE.MeshStandardMaterial({
            color: baseColor,
            map: getWoodAlbedoTexture(maxAnisotropy),
            roughness: spec.roughness ?? 0.68,
            metalness: spec.metalness ?? 0.02,
            transparent: (spec.opacity ?? 1) < 1,
            opacity: spec.opacity ?? 1,
          });
        }
        if (finish === 'emissive') {
          const emissiveCol = new THREE.Color(spec.emissiveColor || spec.color || '#fbbf24');
          return new THREE.MeshStandardMaterial({
            color: baseColor,
            emissive: emissiveCol,
            emissiveIntensity: spec.emissiveIntensity ?? 1.4,
            roughness: spec.roughness ?? 0.3,
            metalness: spec.metalness ?? 0.05,
            transparent: (spec.opacity ?? 1) < 1,
            opacity: spec.opacity ?? 1,
          });
        }

        const presetMap = {
          matte: { roughness: 0.88, metalness: 0.03 },
          satin: { roughness: 0.45, metalness: 0.08 },
          glossy: { roughness: 0.14, metalness: 0.12 },
          metallic: { roughness: 0.2, metalness: 0.92 },
        };
        const preset = presetMap[finish] ?? presetMap.satin;

        return new THREE.MeshStandardMaterial({
          color: baseColor,
          roughness: spec?.roughness ?? preset.roughness,
          metalness: spec?.metalness ?? preset.metalness,
          emissive: spec?.emissiveColor
            ? new THREE.Color(spec.emissiveColor)
            : new THREE.Color(0x000000),
          emissiveIntensity: spec?.emissiveIntensity ?? 0,
          transparent: (spec?.opacity ?? 1) < 1,
          opacity: spec?.opacity ?? 1,
        });
      }

      function createBufferGeometry(shape, params = {}) {
        switch (shape) {
          case 'box':
            return new THREE.BoxGeometry(
              Math.max(0.02, params.width ?? 1),
              Math.max(0.02, params.height ?? 1),
              Math.max(0.02, params.depth ?? 1),
              2,
              2,
              2
            );
          case 'sphere':
            return new THREE.SphereGeometry(
              Math.max(0.02, params.radius ?? 0.6),
              params.radialSegments ?? 36,
              28
            );
          case 'cylinder':
            return new THREE.CylinderGeometry(
              Math.max(0, params.radiusTop ?? params.radius ?? 0.5),
              Math.max(0, params.radiusBottom ?? params.radius ?? 0.5),
              Math.max(0.02, params.height ?? 1.2),
              params.radialSegments ?? 36
            );
          case 'cone':
            return new THREE.ConeGeometry(
              Math.max(0.02, params.radius ?? 0.6),
              Math.max(0.02, params.height ?? 1.2),
              params.radialSegments ?? 36
            );
          case 'torus':
            return new THREE.TorusGeometry(
              Math.max(0.05, params.radius ?? 0.6),
              Math.max(0.015, params.tube ?? 0.18),
              20,
              64
            );
          case 'torusKnot':
            return new THREE.TorusKnotGeometry(
              Math.max(0.05, params.radius ?? 0.55),
              Math.max(0.015, params.tube ?? 0.16),
              96,
              20,
              params.p ?? 2,
              params.q ?? 3
            );
          case 'capsule':
            return new THREE.CapsuleGeometry(
              Math.max(0.02, params.radius ?? 0.35),
              Math.max(0.02, params.length ?? 0.8),
              8,
              24
            );
          case 'dodecahedron':
            return new THREE.DodecahedronGeometry(
              Math.max(0.02, params.radius ?? 0.65),
              params.detail ?? 0
            );
          case 'octahedron':
            return new THREE.OctahedronGeometry(
              Math.max(0.02, params.radius ?? 0.65),
              params.detail ?? 0
            );
          case 'ring': {
            const geo = new THREE.RingGeometry(
              Math.max(0.01, params.innerRadius ?? 0.35),
              Math.max(0.05, params.outerRadius ?? 0.7),
              params.radialSegments ?? 48
            );
            geo.rotateX(-Math.PI / 2);
            return geo;
          }
          case 'plane': {
            const geo = new THREE.PlaneGeometry(
              Math.max(0.05, params.width ?? 2),
              Math.max(0.05, params.depth ?? params.height ?? 2)
            );
            geo.rotateX(-Math.PI / 2);
            return geo;
          }
          case 'lathe': {
            const rawPoints =
              Array.isArray(params.lathePoints) && params.lathePoints.length >= 2
                ? params.lathePoints
                : [
                    [0, 0],
                    [0.4, 0],
                    [0.52, 0.4],
                    [0.35, 0.9],
                    [0.42, 1.2],
                    [0, 1.2],
                  ];
            const vecPoints = rawPoints.map(
              ([r, y]) => new THREE.Vector2(Math.max(0, Number(r) || 0), Number(y) || 0)
            );
            const geo = new THREE.LatheGeometry(vecPoints, params.radialSegments ?? 48);
            geo.computeVertexNormals();
            return geo;
          }
          case 'extrude': {
            const rawPts =
              Array.isArray(params.shapePoints) && params.shapePoints.length >= 3
                ? params.shapePoints
                : [
                    [-0.5, -0.5],
                    [0.5, -0.5],
                    [0.5, 0.5],
                    [-0.5, 0.5],
                  ];
            const shape2d = new THREE.Shape();
            shape2d.moveTo(Number(rawPts[0][0]) || 0, Number(rawPts[0][1]) || 0);
            for (let i = 1; i < rawPts.length; i++) {
              shape2d.lineTo(Number(rawPts[i][0]) || 0, Number(rawPts[i][1]) || 0);
            }
            shape2d.closePath();
            const geo = new THREE.ExtrudeGeometry(shape2d, {
              depth: Math.max(0.02, params.depth ?? 0.3),
              bevelEnabled: true,
              bevelThickness: params.bevelThickness ?? 0.04,
              bevelSize: params.bevelSize ?? 0.04,
              bevelSegments: 3,
            });
            geo.center();
            geo.computeVertexNormals();
            return geo;
          }
          case 'tube': {
            const rawCurve =
              Array.isArray(params.curvePoints) && params.curvePoints.length >= 2
                ? params.curvePoints
                : [
                    [0, 0, 0],
                    [0.4, 0.4, 0],
                    [0.4, 0.9, 0],
                    [0, 1.1, 0],
                  ];
            const vectors = rawCurve.map(
              ([x, y, z]) => new THREE.Vector3(Number(x) || 0, Number(y) || 0, Number(z) || 0)
            );
            const curve = new THREE.CatmullRomCurve3(vectors, Boolean(params.closed));
            const geo = new THREE.TubeGeometry(
              curve,
              48,
              Math.max(0.01, params.radius ?? params.tube ?? 0.08),
              16,
              Boolean(params.closed)
            );
            geo.computeVertexNormals();
            return geo;
          }
          default:
            return new THREE.BoxGeometry(1, 1, 1);
        }
      }

      function buildSceneObject(spec, isSoftwareGl, maxAnisotropy = 4) {
        let root;
        if (spec.shape === 'imported') {
          const group = new THREE.Group();
          group.name = spec.name;
          group.userData.isImported = true;
          root = group;
        } else if (spec.shape === 'group' && Array.isArray(spec.parts) && spec.parts.length > 0) {
          const group = new THREE.Group();
          group.name = spec.name;
          for (const part of spec.parts) {
            const geo = createBufferGeometry(part.shape, part.params);
            const mat = createPBRMaterial(part.material, isSoftwareGl, maxAnisotropy);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.name = part.name;
            mesh.position.set(part.position[0], part.position[1], part.position[2]);
            const rot = part.rotationDeg ?? [0, 0, 0];
            mesh.rotation.set(rot[0] * DEG2RAD, rot[1] * DEG2RAD, rot[2] * DEG2RAD);
            const scl = part.scale ?? [1, 1, 1];
            mesh.scale.set(scl[0], scl[1], scl[2]);
            mesh.castShadow = !isSoftwareGl;
            mesh.receiveShadow = !isSoftwareGl;
            mesh.userData.rootObjectId = spec.id;
            group.add(mesh);
          }
          root = group;
        } else {
          const shape = spec.shape === 'group' ? 'box' : spec.shape;
          const geo = createBufferGeometry(shape, spec.params);
          const mat = createPBRMaterial(spec.material, isSoftwareGl, maxAnisotropy);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.name = spec.name;
          mesh.castShadow = !isSoftwareGl;
          mesh.receiveShadow = !isSoftwareGl;
          mesh.userData.rootObjectId = spec.id;
          root = mesh;
        }

        root.userData.objectId = spec.id;
        root.position.set(spec.position[0], spec.position[1], spec.position[2]);
        root.rotation.set(
          spec.rotationDeg[0] * DEG2RAD,
          spec.rotationDeg[1] * DEG2RAD,
          spec.rotationDeg[2] * DEG2RAD
        );
        root.scale.set(spec.scale[0], spec.scale[1], spec.scale[2]);
        root.visible = spec.visible !== false;

        if (spec.snapToGround && spec.shape !== 'imported') {
          root.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(root);
          if (Number.isFinite(box.min.y)) {
            root.position.y -= box.min.y;
            spec.position = [
              root.position.x,
              Number(root.position.y.toFixed(3)),
              root.position.z,
            ];
          }
        }
        return root;
      }

      function disposeThreeObject(obj) {
        obj.traverse((child) => {
          if (child instanceof THREE.Mesh) {
            child.geometry.dispose();
            if (Array.isArray(child.material)) {
              child.material.forEach((m) => m.dispose());
            } else if (child.material) {
              child.material.dispose();
            }
          }
        });
      }

                },

              },
              {

                  lathePoints: [
                    [0.04, 0.28],

              },

      // =========================================================================
      // 3. Imported 3D File Loader (GLB / GLTF / OBJ / STL)
      // =========================================================================
      const gltfLoader = new GLTFLoader();
      const objLoader = new OBJLoader();
      const stlLoader = new STLLoader();

      async function parseImportedModel(
        data,
        format,
        objectId,
        isSoftwareGl,
        maxAnisotropy,
        overrideMaterial,
        applyOverride = false
      ) {
        let loadedObject;
        if (format === 'glb' || format === 'gltf') {
          const gltf = await new Promise((resolve, reject) => {
            if (format === 'gltf') {
              gltfLoader.parse(new TextDecoder().decode(data), '', resolve, reject);
            } else {
              gltfLoader.parse(data, '', resolve, reject);
            }
          });
          loadedObject = gltf.scene;
        } else if (format === 'obj') {
          loadedObject = objLoader.parse(new TextDecoder().decode(data));
          loadedObject.traverse((child) => {
            if (child instanceof THREE.Mesh && !child.material) {
              child.material = createPBRMaterial(
                overrideMaterial || { color: '#cbd5e1', finish: 'satin' },
                isSoftwareGl,
                maxAnisotropy
              );
            }
          });
        } else if (format === 'stl') {
          const geometry = stlLoader.parse(data);
          geometry.computeVertexNormals();
          const mat = createPBRMaterial(
            overrideMaterial || { color: '#94a3b8', finish: 'satin' },
            isSoftwareGl,
            maxAnisotropy
          );
          loadedObject = new THREE.Mesh(geometry, mat);
        } else {
          throw new Error(`지원하지 않는 3D 파일 형식: ${format}`);
        }

        loadedObject.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(loadedObject);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const normScale = maxDim > 0.0001 ? 1.8 / maxDim : 1;

        const pivot = new THREE.Group();
        loadedObject.scale.multiplyScalar(normScale);
        loadedObject.position.set(
          -center.x * normScale,
          -box.min.y * normScale,
          -center.z * normScale
        );
        pivot.add(loadedObject);

        pivot.traverse((child) => {
          if (child instanceof THREE.Mesh) {
            child.castShadow = !isSoftwareGl;
            child.receiveShadow = !isSoftwareGl;
            child.userData.rootObjectId = objectId;
            if ((applyOverride || format === 'stl') && overrideMaterial) {
              child.material = createPBRMaterial(overrideMaterial, isSoftwareGl, maxAnisotropy);
            } else if (child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              for (const mat of mats) {
                if (
                  mat instanceof THREE.MeshStandardMaterial ||
                  mat instanceof THREE.MeshPhysicalMaterial
                ) {
                  mat.envMapIntensity = 1.0;
                }
              }
            }
          }
        });
        return pivot;
      }

      // =========================================================================
      // 4. Voice Dictation Hook (Web Speech API + Gemini Audio Fallback)
      // =========================================================================
      function getSpeechRecognitionConstructor() {
        const w = window;
        return w.SpeechRecognition || w.webkitSpeechRecognition || null;
      }

      function useVoiceDictation({ language, onFinalTranscript }) {
        const [isListening, setIsListening] = useState(false);
        const [isTranscribing, setIsTranscribing] = useState(false);
        const [interimText, setInterimText] = useState('');
        const [audioLevel, setAudioLevel] = useState(0);
        const [voiceError, setVoiceError] = useState(null);
        const [engineMode, setEngineMode] = useState(() =>
          getSpeechRecognitionConstructor() ? 'speech' : 'gemini-audio'
        );

        const onFinalRef = useRef(onFinalTranscript);
        onFinalRef.current = onFinalTranscript;
        const recognitionRef = useRef(null);
        const mediaRecorderRef = useRef(null);
        const mediaStreamRef = useRef(null);
        const audioCtxRef = useRef(null);
        const levelRafRef = useRef(0);
        const chunksRef = useRef([]);
        const finalBufferRef = useRef('');

        const stopAudioMeter = useCallback(() => {
          if (levelRafRef.current) cancelAnimationFrame(levelRafRef.current);
          levelRafRef.current = 0;
          if (audioCtxRef.current) {
            audioCtxRef.current.close().catch(() => {});
            audioCtxRef.current = null;
          }
          if (mediaStreamRef.current) {
            mediaStreamRef.current.getTracks().forEach((t) => t.stop());
            mediaStreamRef.current = null;
          }
          setAudioLevel(0);
        }, []);

        const startAudioMeter = useCallback((stream) => {
          try {
            const ctx = new AudioContext();
            const source = ctx.createMediaStreamSource(stream);
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            audioCtxRef.current = ctx;
            const data = new Uint8Array(analyser.frequencyBinCount);
            const tick = () => {
              analyser.getByteFrequencyData(data);
              let sum = 0;
              for (let i = 0; i < data.length; i++) sum += data[i];
              setAudioLevel(Math.min(1, sum / data.length / 128));
              levelRafRef.current = requestAnimationFrame(tick);
            };
            tick();
          } catch {}
        }, []);

        const startGeminiRecorder = useCallback(async () => {
          setVoiceError(null);
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStreamRef.current = stream;
            startAudioMeter(stream);
            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
              ? 'audio/webm;codecs=opus'
              : MediaRecorder.isTypeSupported('audio/webm')
                ? 'audio/webm'
                : 'audio/mp4';
            const recorder = new MediaRecorder(stream, { mimeType });
            chunksRef.current = [];
            recorder.ondataavailable = (e) => {
              if (e.data.size > 0) chunksRef.current.push(e.data);
            };
            recorder.onstop = async () => {
              stopAudioMeter();
              const blob = new Blob(chunksRef.current, { type: mimeType });
              chunksRef.current = [];
              if (blob.size < 400) {
                setIsListening(false);
                return;
              }
              setIsTranscribing(true);
              try {
                const buffer = await blob.arrayBuffer();
                const bytes = new Uint8Array(buffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i += 0x8000) {
                  binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
                }
                const res = await fetch(`${API_BASE}/api/transcribe`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    audioBase64: btoa(binary),
                    mimeType: mimeType.split(';')[0],
                    language,
                  }),
                });
                const json = await res.json();
                if (!res.ok) throw new Error(json.error || '음성 인식 실패');
                if (json.transcript) onFinalRef.current(json.transcript);
                else setVoiceError('음성이 감지되지 않았습니다.');
              } catch (err) {
                setVoiceError(err instanceof Error ? err.message : '음성 인식 실패');
              } finally {
                setIsTranscribing(false);
                setIsListening(false);
              }
            };
            mediaRecorderRef.current = recorder;
            recorder.start();
            setIsListening(true);
          } catch {
            stopAudioMeter();
            setIsListening(false);
            setVoiceError('마이크 권한을 허용해 주세요.');
          }
        }, [language, startAudioMeter, stopAudioMeter]);

        const stopListening = useCallback(() => {
          if (recognitionRef.current) {
            try {
              recognitionRef.current.stop();
            } catch {}
            recognitionRef.current = null;
          }
          if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
            mediaRecorderRef.current.stop();
            mediaRecorderRef.current = null;
          } else {
            stopAudioMeter();
            setIsListening(false);
          }
        }, [stopAudioMeter]);

        const startListening = useCallback(async () => {
          setVoiceError(null);
          setInterimText('');
          finalBufferRef.current = '';
          const SpeechCtor = getSpeechRecognitionConstructor();
          if (engineMode === 'gemini-audio' || !SpeechCtor) {
            await startGeminiRecorder();
            return;
          }
          try {
            if (navigator.mediaDevices?.getUserMedia) {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              mediaStreamRef.current = stream;
              startAudioMeter(stream);
            }
          } catch {
            setVoiceError('마이크 접근 권한이 필요합니다.');
            return;
          }
          const recognition = new SpeechCtor();
          recognition.lang = language;
          recognition.continuous = false;
          recognition.interimResults = true;
          recognition.onresult = (event) => {
            let interim = '';
            let finalChunk = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const res = event.results[i];
              const text = res[0]?.transcript || '';
              if (res.isFinal) finalChunk += text;
              else interim += text;
            }
            if (finalChunk) finalBufferRef.current = `${finalBufferRef.current} ${finalChunk}`.trim();
            setInterimText(`${finalBufferRef.current} ${interim}`.trim());
          };
          recognition.onerror = (ev) => {
            if (ev.error === 'not-allowed' || ev.error === 'network') {
              setEngineMode('gemini-audio');
            }
            setVoiceError(`음성 인식 오류 (${ev.error})`);
            stopAudioMeter();
            setIsListening(false);
          };
          recognition.onend = () => {
            stopAudioMeter();
            setIsListening(false);
            recognitionRef.current = null;
            const finalText = finalBufferRef.current.trim();
            setInterimText('');
            if (finalText) onFinalRef.current(finalText);
          };
          recognitionRef.current = recognition;
          setIsListening(true);
          recognition.start();
        }, [engineMode, language, startAudioMeter, startGeminiRecorder, stopAudioMeter]);

        const toggleListening = useCallback(() => {
          if (isListening) stopListening();
          else startListening();
        }, [isListening, startListening, stopListening]);

        useEffect(() => {
          return () => {
            if (recognitionRef.current) try { recognitionRef.current.abort(); } catch {}
            if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
              mediaRecorderRef.current.stop();
            }
            stopAudioMeter();
          };
        }, [stopAudioMeter]);

        return {
          isListening,
          isTranscribing,
          interimText,
          audioLevel,
          voiceError,
          engineMode,
          setEngineMode,
          toggleListening,
        };
      }

      // =========================================================================
      // 5. Three.js Studio Viewport Component
      // =========================================================================
      const _targetCamPos = new THREE.Vector3(4.2, 2.9, 4.6);
      const _targetLookAt = new THREE.Vector3(0, 0.7, 0);
      const _box = new THREE.Box3();
      const _boxCenter = new THREE.Vector3();
      const _boxSize = new THREE.Vector3();

      function detectSoftwareWebGL() {
        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
          if (!gl) return true;
          const ext = gl.getExtension('WEBGL_debug_renderer_info');
          const gpu = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '');
          gl.getExtension('WEBGL_lose_context')?.loseContext();
          return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
        } catch {
          return true;
        }
      }

      const StudioViewport = forwardRef(function StudioViewport(
        { objects, selectedId, transformMode, showGrid, theme, onSelectObject, onCommitTransform, onDropFiles },
        ref
      ) {
        const mountRef = useRef(null);
        const [contextLost, setContextLost] = useState(false);
        const [isDraggingFile, setIsDraggingFile] = useState(false);
        const onSelectRef = useRef(onSelectObject);
        onSelectRef.current = onSelectObject;
        const onCommitTransformRef = useRef(onCommitTransform);
        onCommitTransformRef.current = onCommitTransform;
        const selectedIdRef = useRef(selectedId);
        selectedIdRef.current = selectedId;
        const engineRef = useRef(null);

        useEffect(() => {
          const container = mountRef.current;
          if (!container) return;
          const isSoftwareGl = detectSoftwareWebGL();
          const renderer = new THREE.WebGLRenderer({
            antialias: !isSoftwareGl,
            powerPreference: 'high-performance',
          });
          const width = container.clientWidth || window.innerWidth;
          const height = container.clientHeight || window.innerHeight;
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.08;
          renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio || 1, 2));
          renderer.setSize(width, height);
          renderer.shadowMap.enabled = !isSoftwareGl;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          const canvas = renderer.domElement;
          canvas.style.display = 'block';
          canvas.style.width = '100%';
          canvas.style.height = '100%';
          container.appendChild(canvas);

          const scene = new THREE.Scene();
          const initBg = theme === 'dark' ? 0x10141c : 0xe9eef5;
          scene.background = new THREE.Color(initBg);
          scene.fog = new THREE.FogExp2(initBg, 0.022);

          const pmremGenerator = new THREE.PMREMGenerator(renderer);
          const envTex = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
          scene.environment = envTex;
          pmremGenerator.dispose();

          const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 150);
          camera.position.set(4.2, 2.9, 4.6);

          scene.add(new THREE.HemisphereLight(0xdbeafe, 0x334155, 0.65));
          const keyLight = new THREE.DirectionalLight(0xfff5e8, 1.9);
          keyLight.position.set(5.5, 8.5, 5.0);
          if (!isSoftwareGl) {
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.set(2048, 2048);
            const d = 7;
            keyLight.shadow.camera.left = -d;
            keyLight.shadow.camera.right = d;
            keyLight.shadow.camera.top = d;
            keyLight.shadow.camera.bottom = -d;
            keyLight.shadow.camera.near = 0.5;
            keyLight.shadow.camera.far = 26;
            keyLight.shadow.bias = -0.0005;
            keyLight.shadow.normalBias = 0.02;
          }
          scene.add(keyLight);

          const rimLight = new THREE.DirectionalLight(0x93c5fd, 0.75);
          rimLight.position.set(-5.5, 4.5, -6.0);
          scene.add(rimLight);

          if (!isSoftwareGl) {
            RectAreaLightUniformsLib.init();
            const softbox = new THREE.RectAreaLight(0xffffff, 2.4, 4, 2.5);
            softbox.position.set(-4.5, 4.2, 2.5);
            softbox.lookAt(0, 0.8, 0);
            scene.add(softbox);
          }

          const floorGeo = new THREE.CircleGeometry(18, 64);
          floorGeo.rotateX(-Math.PI / 2);
          const floorMat = new THREE.MeshStandardMaterial({
            color: theme === 'dark' ? 0x131822 : 0xe2e8f0,
            roughness: 0.9,
            metalness: 0.04,
          });
          const groundDisc = new THREE.Mesh(floorGeo, floorMat);
          groundDisc.position.y = -0.004;
          groundDisc.receiveShadow = !isSoftwareGl;
          scene.add(groundDisc);

          const contactGeo = new THREE.PlaneGeometry(5.5, 5.5);
          contactGeo.rotateX(-Math.PI / 2);
          const contactMat = new THREE.MeshBasicMaterial({
            map: getContactShadowTexture(),
            transparent: true,
            opacity: 0.38,
            depthWrite: false,
          });
          const contactPlane = new THREE.Mesh(contactGeo, contactMat);
          contactPlane.position.y = -0.002;
          scene.add(contactPlane);

          const grid = new THREE.GridHelper(24, 24, 0x3b82f6, 0x334155);
          grid.position.y = 0.001;
          const gridMats = Array.isArray(grid.material) ? grid.material : [grid.material];
          for (const gm of gridMats) {
            gm.transparent = true;
            gm.opacity = theme === 'dark' ? 0.35 : 0.45;
            gm.polygonOffset = true;
            gm.polygonOffsetFactor = -1;
            gm.polygonOffsetUnits = -1;
          }
          scene.add(grid);

          const modelRoot = new THREE.Group();
          modelRoot.name = 'VocaCAD_ModelRoot';
          scene.add(modelRoot);

          const orbit = new OrbitControls(camera, canvas);
          orbit.target.set(0, 0.7, 0);
          orbit.enableDamping = !isSoftwareGl;
          orbit.dampingFactor = 0.07;
          orbit.maxPolarAngle = Math.PI / 2 - 0.03;
          orbit.minDistance = 1.2;
          orbit.maxDistance = 32;

          const transform = new TransformControls(camera, canvas);
          transform.setSize(0.78);
          scene.add(transform.getHelper());

          let frameId = 0;
          let renderBusy = false;
          let renderDirty = false;
          let transitionActive = false;
          let lastTime = performance.now();

          function afterDraw(cb) {
            const gl = renderer.getContext();
            if (!gl || typeof gl.fenceSync !== 'function') {
              frameId = window.setTimeout(cb, 80);
              return;
            }
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.flush();
            const poll = () => {
              const state = sync && gl.getSyncParameter(sync, gl.SYNC_STATUS);
              if (state === gl.UNSIGNALED) frameId = window.setTimeout(poll, 5);
              else {
                if (sync) gl.deleteSync(sync);
                frameId = window.setTimeout(cb, 80);
              }
            };
            frameId = window.setTimeout(poll, 5);
          }

          function requestRender() {
            if (renderBusy) {
              renderDirty = true;
              return;
            }
            renderBusy = true;
            frameId = requestAnimationFrame((now) => {
              renderDirty = false;
              const dt = Math.min((now - lastTime) / 1000, 0.1);
              lastTime = now;
              if (transitionActive) {
                const lambda = 7.5;
                camera.position.x = THREE.MathUtils.damp(camera.position.x, _targetCamPos.x, lambda, dt);
                camera.position.y = THREE.MathUtils.damp(camera.position.y, _targetCamPos.y, lambda, dt);
                camera.position.z = THREE.MathUtils.damp(camera.position.z, _targetCamPos.z, lambda, dt);
                orbit.target.x = THREE.MathUtils.damp(orbit.target.x, _targetLookAt.x, lambda, dt);
                orbit.target.y = THREE.MathUtils.damp(orbit.target.y, _targetLookAt.y, lambda, dt);
                orbit.target.z = THREE.MathUtils.damp(orbit.target.z, _targetLookAt.z, lambda, dt);
                if (
                  camera.position.distanceTo(_targetCamPos) < 0.015 &&
                  orbit.target.distanceTo(_targetLookAt) < 0.015
                ) {
                  camera.position.copy(_targetCamPos);
                  orbit.target.copy(_targetLookAt);
                  transitionActive = false;
                } else {
                  renderDirty = true;
                }
              }
              orbit.update();
              if (engineRef.current?.selectionHelper) engineRef.current.selectionHelper.update();
              renderer.render(scene, camera);
              const done = () => {
                renderBusy = false;
                if (renderDirty) requestRender();
              };
              if (isSoftwareGl) afterDraw(done);
              else done();
            });
          }

          function startCameraTransition(pos, lookAt) {
            _targetCamPos.copy(pos);
            _targetLookAt.copy(lookAt);
            transitionActive = true;
            lastTime = performance.now();
            requestRender();
          }

          orbit.addEventListener('start', () => { transitionActive = false; });
          orbit.addEventListener('change', requestRender);

          transform.addEventListener('dragging-changed', (event) => {
            orbit.enabled = !event.value;
            if (!event.value && transform.object) {
              const obj = transform.object;
              const id = obj.userData.objectId;
              if (id) {
                onCommitTransformRef.current(
                  id,
                  [Number(obj.position.x.toFixed(3)), Number(obj.position.y.toFixed(3)), Number(obj.position.z.toFixed(3))],
                  [Number((obj.rotation.x * RAD2DEG).toFixed(1)), Number((obj.rotation.y * RAD2DEG).toFixed(1)), Number((obj.rotation.z * RAD2DEG).toFixed(1))],
                  [Number(obj.scale.x.toFixed(3)), Number(obj.scale.y.toFixed(3)), Number(obj.scale.z.toFixed(3))]
                );
              }
            }
            requestRender();
          });

          transform.addEventListener('change', () => {
            if (engineRef.current?.selectionHelper) engineRef.current.selectionHelper.update();
            requestRender();
          });

          const raycaster = new THREE.Raycaster();
          const pointerDownPos = new THREE.Vector2();
          const ndc = new THREE.Vector2();

          const handlePointerDown = (e) => pointerDownPos.set(e.clientX, e.clientY);
          const handlePointerUp = (e) => {
            if (transform.dragging) return;
            if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 5) return;
            const rect = canvas.getBoundingClientRect();
            ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(ndc, camera);
            const hits = raycaster.intersectObjects(modelRoot.children, true);
            if (hits.length > 0) {
              let curr = hits[0].object;
              let foundId = null;
              while (curr && curr !== modelRoot) {
                if (typeof curr.userData.objectId === 'string') { foundId = curr.userData.objectId; break; }
                if (typeof curr.userData.rootObjectId === 'string') { foundId = curr.userData.rootObjectId; break; }
                curr = curr.parent;
              }
              onSelectRef.current(foundId);
            } else {
              onSelectRef.current(null);
            }
          };
          canvas.addEventListener('pointerdown', handlePointerDown);
          canvas.addEventListener('pointerup', handlePointerUp);

          const handleContextLost = (e) => { e.preventDefault(); setContextLost(true); };
          const handleContextRestored = () => { setContextLost(false); requestRender(); };
          canvas.addEventListener('webglcontextlost', handleContextLost);
          canvas.addEventListener('webglcontextrestored', handleContextRestored);

          const handleResize = () => {
            if (!container) return;
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            requestRender();
          };
          window.addEventListener('resize', handleResize);

          engineRef.current = {
            scene,
            camera,
            renderer,
            orbit,
            transform,
            modelRoot,
            grid,
            groundDisc,
            selectionHelper: null,
            objectMap: new Map(),
            isSoftwareGl,
            maxAnisotropy: Math.min(renderer.capabilities.getMaxAnisotropy() || 4, 8),
            requestRender,
            startCameraTransition,
          };

          if (!isSoftwareGl) renderer.compile(scene, camera);
          requestRender();

          return () => {
            cancelAnimationFrame(frameId);
            clearTimeout(frameId);
            window.removeEventListener('resize', handleResize);
            canvas.removeEventListener('pointerdown', handlePointerDown);
            canvas.removeEventListener('pointerup', handlePointerUp);
            canvas.removeEventListener('webglcontextlost', handleContextLost);
            canvas.removeEventListener('webglcontextrestored', handleContextRestored);
            transform.detach();
            transform.dispose();
            orbit.dispose();
            modelRoot.children.forEach(disposeThreeObject);
            floorGeo.dispose();
            floorMat.dispose();
            contactGeo.dispose();
            contactMat.dispose();
            envTex.dispose();
            renderer.dispose();
            if (canvas.parentNode === container) container.removeChild(canvas);
            engineRef.current = null;
          };
        }, []);

        useEffect(() => {
          const eng = engineRef.current;
          if (!eng) return;
          let cancelled = false;
          eng.transform.detach();
          if (eng.selectionHelper) {
            eng.scene.remove(eng.selectionHelper);
            eng.selectionHelper.dispose();
            eng.selectionHelper = null;
          }
          while (eng.modelRoot.children.length > 0) {
            const child = eng.modelRoot.children[0];
            eng.modelRoot.remove(child);
            disposeThreeObject(child);
          }
          eng.objectMap.clear();

          for (const spec of objects) {
            const obj3d = buildSceneObject(spec, eng.isSoftwareGl, eng.maxAnisotropy);
            eng.modelRoot.add(obj3d);
            eng.objectMap.set(spec.id, obj3d);
            if (spec.shape === 'imported' && spec.importedAssetId) {
              getAssetRecord(spec.importedAssetId).then(async (asset) => {
                if (cancelled || !asset) return;
                const pivot = await parseImportedModel(
                  asset.data,
                  spec.importedFormat || asset.format,
                  spec.id,
                  eng.isSoftwareGl,
                  eng.maxAnisotropy,
                  spec.material,
                  Boolean(spec.overrideImportedMaterial)
                );
                if (cancelled) { disposeThreeObject(pivot); return; }
                obj3d.add(pivot);
                if (selectedIdRef.current === spec.id) {
                  if (eng.selectionHelper) eng.selectionHelper.update();
                  else {
                    const helper = new THREE.BoxHelper(obj3d, 0x38bdf8);
                    eng.scene.add(helper);
                    eng.selectionHelper = helper;
                  }
                }
                eng.requestRender();
              });
            }
          }

          if (selectedId && eng.objectMap.has(selectedId)) {
            const target = eng.objectMap.get(selectedId);
            eng.transform.attach(target);
            const helper = new THREE.BoxHelper(target, 0x38bdf8);
            eng.scene.add(helper);
            eng.selectionHelper = helper;
          }
          eng.requestRender();
          return () => { cancelled = true; };
        }, [objects, selectedId]);

        useEffect(() => {
          if (engineRef.current) {
            engineRef.current.transform.setMode(transformMode);
            engineRef.current.requestRender();
          }
        }, [transformMode]);

        useEffect(() => {
          if (engineRef.current) {
            engineRef.current.grid.visible = showGrid;
            engineRef.current.requestRender();
          }
        }, [showGrid]);

        useEffect(() => {
          const eng = engineRef.current;
          if (!eng) return;
          const bgHex = theme === 'dark' ? 0x10141c : 0xe9eef5;
          eng.scene.background = new THREE.Color(bgHex);
          if (eng.scene.fog) eng.scene.fog.color.setHex(bgHex);
          eng.groundDisc.material.color.setHex(theme === 'dark' ? 0x131822 : 0xe2e8f0);
          const gridMats = Array.isArray(eng.grid.material) ? eng.grid.material : [eng.grid.material];
          for (const gm of gridMats) gm.opacity = theme === 'dark' ? 0.34 : 0.45;
          eng.requestRender();
        }, [theme]);

        useImperativeHandle(ref, () => ({
          setCameraPreset(preset) {
            const eng = engineRef.current;
            if (!eng) return;
            const focusTarget =
              preset === 'focus' && selectedIdRef.current
                ? eng.objectMap.get(selectedIdRef.current) || eng.modelRoot
                : eng.modelRoot;
            if (focusTarget.children.length > 0 || focusTarget instanceof THREE.Mesh) {
              _box.setFromObject(focusTarget);
              _box.getCenter(_boxCenter);
              _box.getSize(_boxSize);
            } else {
              _boxCenter.set(0, 0.7, 0);
              _boxSize.set(2.5, 2.0, 2.5);
            }
            const radius = Math.max(_boxSize.length() * 0.9, 2.8);
            if (preset === 'front') eng.startCameraTransition(new THREE.Vector3(_boxCenter.x, _boxCenter.y + 0.4, _boxCenter.z + radius * 1.45), _boxCenter.clone());
            else if (preset === 'side') eng.startCameraTransition(new THREE.Vector3(_boxCenter.x + radius * 1.45, _boxCenter.y + 0.4, _boxCenter.z), _boxCenter.clone());
            else if (preset === 'top') eng.startCameraTransition(new THREE.Vector3(_boxCenter.x, _boxCenter.y + radius * 1.65, _boxCenter.z + 0.05), _boxCenter.clone());
            else if (preset === 'focus') eng.startCameraTransition(new THREE.Vector3(_boxCenter.x + radius * 0.95, _boxCenter.y + radius * 0.65, _boxCenter.z + radius * 1.05), _boxCenter.clone());
            else eng.startCameraTransition(new THREE.Vector3(4.2, 2.9, 4.6), new THREE.Vector3(0, 0.7, 0));
          },
          exportGLB(fileName = 'vocacad-model.glb') {
            const eng = engineRef.current;
            if (!eng) return Promise.resolve();
            const exporter = new GLTFExporter();
            return new Promise((resolve, reject) => {
              exporter.parse(
                eng.modelRoot,
                (result) => {
                  const blob = result instanceof ArrayBuffer
                    ? new Blob([result], { type: 'model/gltf-binary' })
                    : new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = fileName;
                  a.click();
                  URL.revokeObjectURL(url);
                  resolve();
                },
                reject,
                { binary: true }
              );
            });
          },
          exportPNG(fileName = 'vocacad-render.png') {
            const eng = engineRef.current;
            if (!eng) return;
            const prevH = eng.selectionHelper?.visible ?? false;
            const prevT = eng.transform.getHelper().visible;
            if (eng.selectionHelper) eng.selectionHelper.visible = false;
            eng.transform.getHelper().visible = false;
            eng.renderer.render(eng.scene, eng.camera);
            const url = eng.renderer.domElement.toDataURL('image/png');
            if (eng.selectionHelper) eng.selectionHelper.visible = prevH;
            eng.transform.getHelper().visible = prevT;
            eng.requestRender();
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
          },
          captureThumbnail() {
            const eng = engineRef.current;
            if (!eng) return null;
            const prevH = eng.selectionHelper?.visible ?? false;
            const prevT = eng.transform.getHelper().visible;
            if (eng.selectionHelper) eng.selectionHelper.visible = false;
            eng.transform.getHelper().visible = false;
            eng.renderer.render(eng.scene, eng.camera);
            const thumbCanvas = document.createElement('canvas');
            thumbCanvas.width = 480;
            thumbCanvas.height = 300;
            const ctx = thumbCanvas.getContext('2d');
            const out = ctx ? (ctx.drawImage(eng.renderer.domElement, 0, 0, 480, 300), thumbCanvas.toDataURL('image/jpeg', 0.82)) : null;
            if (eng.selectionHelper) eng.selectionHelper.visible = prevH;
            eng.transform.getHelper().visible = prevT;
            eng.requestRender();
            return out;
          },
        }));

        return html`
          <div
            className="relative w-full h-full overflow-hidden"
            onDragOver=${(e) => {
              if (e.dataTransfer?.types.includes('Files')) {
                e.preventDefault();
                setIsDraggingFile(true);
              }
            }}
            onDragLeave=${() => setIsDraggingFile(false)}
            onDrop=${(e) => {
              e.preventDefault();
              setIsDraggingFile(false);
              if (e.dataTransfer?.files?.length && onDropFiles) onDropFiles(e.dataTransfer.files);
            }}
          >
            <div ref=${mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
            ${isDraggingFile && html`
              <div className="absolute inset-0 z-20 flex items-center justify-center bg-slate-950/75 border-2 border-dashed border-sky-400 pointer-events-none">
                <div className="px-6 py-4 rounded-xl bg-slate-900 border border-white/15 text-sm font-medium text-slate-100">
                  GLB, GLTF, OBJ, STL 또는 프로젝트 JSON 파일을 놓아 장면에 추가하세요
                </div>
              </div>
            `}
            ${contextLost && html`
              <div className="absolute inset-0 z-20 flex items-center justify-center bg-slate-950/85 text-slate-100">
                <div className="px-6 py-4 rounded-xl border border-white/15 bg-slate-900 text-sm">
                  WebGL 그래픽 컨텍스트를 복구하는 중입니다...
                </div>
              </div>
            `}
          </div>
        `;
      });

      // =========================================================================
      // 8. Main App
      // =========================================================================
      const generateId = (prefix = 'obj') => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
      const cloneObjects = (list) => JSON.parse(JSON.stringify(list));

      function App() {
        const viewportRef = useRef(null);
        const [viewMode, setViewMode] = useState('start');
        const [projects, setProjects] = useState([]);
        const [isLoadingProjects, setIsLoadingProjects] = useState(true);
        const [uploadError, setUploadError] = useState(null);

        const [activeProjectId, setActiveProjectId] = useState(() => generateId('proj'));
        const [projectName, setProjectName] = useState('새 3D 프로젝트');
        const [projectCreatedAt, setProjectCreatedAt] = useState(() => Date.now());
        const [objects, setObjects] = useState(() => createStarterSceneObjects());
        const [selectedId, setSelectedId] = useState('obj_lamp_starter');
        const [undoStack, setUndoStack] = useState([]);
        const [redoStack, setRedoStack] = useState([]);

        const [transformMode, setTransformMode] = useState('translate');
        const [showGrid, setShowGrid] = useState(true);
        const [theme, setTheme] = useState('dark');
        const [dockCollapsed, setDockCollapsed] = useState(false);

        const [commandText, setCommandText] = useState('');
        const [isProcessing, setIsProcessing] = useState(false);
        const [isExporting, setIsExporting] = useState(false);
        const [lastReply, setLastReply] = useState('스튜디오가 준비되었습니다.');
        const [lastError, setLastError] = useState(null);
        const [language, setLanguage] = useState('ko-KR');
        const [history, setHistory] = useState([]);

        useEffect(() => {
          listProjects().then((loaded) => {
            setProjects(loaded);
            setIsLoadingProjects(false);
          });
        }, []);

        useEffect(() => {
          document.documentElement.classList.toggle('dark', theme === 'dark');
        }, [theme]);

        const selectedObject = useMemo(() => objects.find((o) => o.id === selectedId) ?? null, [objects, selectedId]);

        const persistCurrentProject = useCallback(async (captureThumb = true) => {
          if (objects.length === 0 && history.length === 0) return;
          const thumb = captureThumb ? viewportRef.current?.captureThumbnail() ?? undefined : undefined;
          await saveStoredProject({
            id: activeProjectId,
            name: projectName.trim() || '제목 없는 3D 프로젝트',
            createdAt: projectCreatedAt,
            updatedAt: Date.now(),
            objectCount: objects.length,
            lastPrompt: history[0]?.transcript,
            thumbnailDataUrl: thumb,
            objects: cloneObjects(objects),
            history: [...history],
          });
          setProjects(await listProjects());
        }, [activeProjectId, history, objects, projectCreatedAt, projectName]);

        useEffect(() => {
          if (viewMode !== 'studio') return;
          if (objects.length === 0 && history.length === 0) return;
          const t = setTimeout(() => { persistCurrentProject(true).catch(() => {}); }, 900);
          return () => clearTimeout(t);
        }, [viewMode, objects, projectName, history, persistCurrentProject]);

        const pushHistorySnapshot = useCallback((snapshot) => {
          setUndoStack((prev) => [...prev.slice(-24), cloneObjects(snapshot)]);
          setRedoStack([]);
        }, []);

        const handleUndo = useCallback(() => {
          setUndoStack((prev) => {
            if (!prev.length) return prev;
            const previous = prev[prev.length - 1];
            setRedoStack((r) => [...r, cloneObjects(objects)]);
            setObjects(previous);
            return prev.slice(0, -1);
          });
        }, [objects]);

        const handleRedo = useCallback(() => {
          setRedoStack((prev) => {
            if (!prev.length) return prev;
            const next = prev[prev.length - 1];
            setUndoStack((u) => [...u, cloneObjects(objects)]);
            setObjects(next);
            return prev.slice(0, -1);
          });
        }, [objects]);

        const applyOperations = useCallback((ops, baseObjects, baseSelectedId) => {
          const currentObjects = baseObjects ?? objects;
          let nextObjects = cloneObjects(currentObjects);
          let nextSelectedId = baseSelectedId !== undefined ? baseSelectedId : selectedId;
          let pendingCamera = null;

          for (const op of ops) {
            if (op.type === 'delete') {
              if (op.targetId === 'all') { nextObjects = []; nextSelectedId = null; }
              else { nextObjects = nextObjects.filter((o) => o.id !== op.targetId); }
            } else if (op.type === 'add') {
              const newId = op.object.id || generateId('model');
              nextObjects.push({ position: [0, 0, 0], rotationDeg: [0, 0, 0], scale: [1, 1, 1], ...op.object, id: newId });
              nextSelectedId = newId;
            } else if (op.type === 'update') {
              const idx = nextObjects.findIndex((o) => o.id === op.targetId);
              if (idx === -1) continue;
              const target = { ...nextObjects[idx] };
              if (op.name) target.name = op.name;
              if (op.position) target.position = op.position;
              if (op.deltaPosition) target.position = [target.position[0] + op.deltaPosition[0], target.position[1] + op.deltaPosition[1], target.position[2] + op.deltaPosition[2]];
              if (op.rotationDeg) target.rotationDeg = op.rotationDeg;
              if (op.deltaRotationDeg) target.rotationDeg = [target.rotationDeg[0] + op.deltaRotationDeg[0], target.rotationDeg[1] + op.deltaRotationDeg[1], target.rotationDeg[2] + op.deltaRotationDeg[2]];
              if (op.scale) target.scale = op.scale;
              if (typeof op.scaleMultiplier === 'number') {
                const m = Math.max(0.05, op.scaleMultiplier);
                target.scale = [target.scale[0] * m, target.scale[1] * m, target.scale[2] * m];
              }
              if (op.material) {
                target.material = { ...target.material, ...op.material };
                if (target.shape === 'imported') target.overrideImportedMaterial = true;
                if (target.shape === 'group' && Array.isArray(target.parts)) {
                  target.parts = target.parts.map((p) => ({ ...p, material: { ...p.material, ...op.material } }));
                }
              }
              nextObjects[idx] = target;
              nextSelectedId = target.id;
            } else if (op.type === 'duplicate') {
              const src = nextObjects.find((o) => o.id === op.targetId);
              if (!src) continue;
              const count = Math.min(Math.max(op.count ?? 1, 1), 20);
              const off = op.offset ?? [1.5, 0, 0];
              for (let i = 1; i <= count; i++) {
                const copy = cloneObjects([src])[0];
                copy.id = generateId('dup');
                copy.name = op.newName || `${src.name} (${i})`;
                copy.position = [src.position[0] + off[0] * i, src.position[1] + off[1] * i, src.position[2] + off[2] * i];
                nextObjects.push(copy);
                nextSelectedId = copy.id;
              }
            } else if (op.type === 'select') nextSelectedId = op.targetId;
            else if (op.type === 'camera') pendingCamera = op.preset;
          }

          pushHistorySnapshot(currentObjects);
          setObjects(nextObjects);
          setSelectedId(nextSelectedId);
          if (pendingCamera) setTimeout(() => viewportRef.current?.setCameraPreset(pendingCamera), 40);
        }, [objects, pushHistorySnapshot, selectedId]);

        const runModelingCommand = useCallback(async (rawText, source, overrideObjects, overrideSelectedId) => {
          const instruction = rawText.trim();
          if (!instruction || isProcessing) return;
          const activeObjects = overrideObjects ?? objects;
          const activeSelId = overrideSelectedId !== undefined ? overrideSelectedId : selectedId;
          setIsProcessing(true);
          setLastError(null);
          if (source !== 'preset') setCommandText('');

          const sceneSummary = activeObjects.map((o) => ({
            id: o.id, name: o.name, shape: o.shape, position: o.position,
            rotationDeg: o.rotationDeg, scale: o.scale, color: o.material.color,
            finish: o.material.finish, partCount: o.parts?.length ?? 1,
          }));

          try {
            const res = await fetch(`${API_BASE}/api/model-command`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ instruction, sceneSummary, selectedId: activeSelId }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || '3D 모델링 요청 처리에 실패했습니다.');
            if (Array.isArray(data.operations) && data.operations.length > 0) {
              applyOperations(data.operations, activeObjects, activeSelId);
            }
            setLastReply(data.reply || '모델을 업데이트했습니다.');
            setHistory((prev) => [{
              id: generateId('hist'),
              timestamp: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
              transcript: instruction,
              reply: data.reply,
              operationCount: data.operations?.length ?? 0,
              source,
            }, ...prev.slice(0, 19)]);
          } catch (err) {
            setLastError(err instanceof Error ? err.message : '요청 오류가 발생했습니다.');
          } finally {
            setIsProcessing(false);
          }
        }, [applyOperations, isProcessing, objects, selectedId]);

        const voice = useVoiceDictation({
          language,
          onFinalTranscript: (t) => {
            setCommandText(t);
            runModelingCommand(t, 'voice');
          },
        });

        const handleUploadFiles = useCallback(async (fileList) => {
          setUploadError(null);
          setLastError(null);
          const files = Array.from(fileList);
          const addedSpecs = [];
          try {
            for (const file of files) {
              const ext = file.name.toLowerCase().split('.').pop();
              if (ext === 'json') {
                const parsed = JSON.parse(await file.text());
                if (!Array.isArray(parsed.objects)) throw new Error('유효한 프로젝트 JSON이 아닙니다.');
                setActiveProjectId(generateId('proj'));
                setProjectName(parsed.name || file.name.replace(/\.json$/i, ''));
                setProjectCreatedAt(Date.now());
                setObjects(parsed.objects);
                setSelectedId(parsed.objects[0]?.id ?? null);
                setHistory(parsed.history || []);
                setViewMode('studio');
                setTimeout(() => viewportRef.current?.setCameraPreset('focus'), 120);
                return;
              }
              if (['glb', 'gltf', 'obj', 'stl'].includes(ext)) {
                const buffer = await file.arrayBuffer();
                const assetId = generateId('asset');
                await saveAssetRecord({ id: assetId, fileName: file.name, format: ext, data: buffer, createdAt: Date.now() });
                addedSpecs.push({
                  id: generateId('imp'),
                  name: file.name.replace(/\.(glb|gltf|obj|stl)$/i, ''),
                  shape: 'imported',
                  importedAssetId: assetId,
                  importedFormat: ext,
                  overrideImportedMaterial: false,
                  position: [addedSpecs.length * 1.6, 0, 0],
                  rotationDeg: [0, 0, 0],
                  scale: [1, 1, 1],
                  material: { color: '#94a3b8', finish: 'satin' },
                  visible: true,
                });
              } else {
                throw new Error(`지원하지 않는 형식입니다: ${file.name}`);
              }
            }
            if (addedSpecs.length > 0) {
              if (viewMode === 'start') {
                setActiveProjectId(generateId('proj'));
                setProjectName(addedSpecs[0].name);
                setProjectCreatedAt(Date.now());
                setObjects(addedSpecs);
                setSelectedId(addedSpecs[addedSpecs.length - 1].id);
                setHistory([]);
                setViewMode('studio');
              } else {
                pushHistorySnapshot(objects);
                setObjects((prev) => [...prev, ...addedSpecs]);
                setSelectedId(addedSpecs[addedSpecs.length - 1].id);
              }
              setTimeout(() => viewportRef.current?.setCameraPreset('focus'), 150);
            }
          } catch (err) {
            const msg = err instanceof Error ? err.message : '파일 업로드 오류';
            if (viewMode === 'start') setUploadError(msg);
            else setLastError(msg);
          }
        }, [objects, pushHistorySnapshot, viewMode]);

        if (viewMode === 'start') {
          return html`<${StartScreen}
            projects=${projects}
            theme=${theme}
            isLoadingProjects=${isLoadingProjects}
            uploadError=${uploadError}
            onToggleTheme=${() => setTheme((t) => (t === 'dark' ? 'light' : 'dark'))}
            onStartEmpty=${() => {
              setActiveProjectId(generateId('proj'));
              setProjectName('새 3D 작업실');
              setProjectCreatedAt(Date.now());
              setObjects([]);
              setSelectedId(null);
              setHistory([]);
              setViewMode('studio');
            }}
            onStartStarter=${() => {
              const starter = createStarterSceneObjects();
              setActiveProjectId(generateId('proj'));
              setProjectName('스튜디오 데스크 램프 & 화병');
              setProjectCreatedAt(Date.now());
              setObjects(starter);
              setSelectedId(starter[0].id);
              setHistory([]);
              setViewMode('studio');
            }}
            onStartWithPrompt=${(prompt, source) => {
              setActiveProjectId(generateId('proj'));
              setProjectName(prompt.slice(0, 22));
              setProjectCreatedAt(Date.now());
              setObjects([]);
              setSelectedId(null);
              setHistory([]);
              setViewMode('studio');
              runModelingCommand(prompt, source, [], null);
            }}
            onOpenProject=${(p) => {
              setActiveProjectId(p.id);
              setProjectName(p.name);
              setProjectCreatedAt(p.createdAt);
              const cloned = cloneObjects(p.objects || []);
              setObjects(cloned);
              setSelectedId(cloned[0]?.id ?? null);
              setHistory(p.history || []);
              setViewMode('studio');
              setTimeout(() => viewportRef.current?.setCameraPreset('iso'), 60);
            }}
            onDeleteProject=${async (id) => {
              await deleteStoredProject(id);
              setProjects(await listProjects());
            }}
            onExportProjectJSON=${(p) => {
              const blob = new Blob([JSON.stringify({ app: 'VocaCAD Studio', version: 1, ...p }, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `${p.name.replace(/\s+/g, '_')}.vocacad.json`;
              a.click();
              URL.revokeObjectURL(url);
            }}
            onUploadFiles=${handleUploadFiles}
          />`;
        }

        return html`
          <div className="relative w-screen h-screen overflow-hidden bg-[#10141c]">
            <${TopBar}
              canUndo=${undoStack.length > 0}
              showGrid=${showGrid}
              theme=${theme}
              objectCount=${objects.length}
              isExporting=${isExporting}
              onGoHome=${async () => { await persistCurrentProject(true); setViewMode('start'); }}
              onUploadFiles=${handleUploadFiles}
              onUndo=${handleUndo}
              onToggleGrid=${() => setShowGrid((g) => !g)}
              onToggleTheme=${() => setTheme((t) => (t === 'dark' ? 'light' : 'dark'))}
              onExportGLB=${async () => {
                setIsExporting(true);
                try { await viewportRef.current?.exportGLB(`${projectName || 'vocacad-model'}.glb`); }
                finally { setIsExporting(false); }
              }}
            />
            <main className="w-full h-full pt-14">
              <${StudioViewport}
                ref=${viewportRef}
                objects=${objects}
                selectedId=${selectedId}
                transformMode=${transformMode}
                showGrid=${showGrid}
                theme=${theme}
                onSelectObject=${setSelectedId}
                onCommitTransform=${(id, pos, rot, scl) => {
                  pushHistorySnapshot(objects);
                  setObjects((prev) => prev.map((o) => (o.id === id ? { ...o, position: pos, rotationDeg: rot, scale: scl } : o)));
                }}
                onDropFiles=${handleUploadFiles}
              />
            </main>
            <${BottomControlDock}
              collapsed=${dockCollapsed}
              onToggleCollapsed=${() => setDockCollapsed((c) => !c)}
              commandText=${commandText}
              onChangeCommandText=${setCommandText}
              onSubmitCommand=${runModelingCommand}
              isProcessing=${isProcessing}
              lastReply=${lastReply}
              lastError=${lastError}
              language=${language}
              onToggleLanguage=${() => setLanguage((l) => (l === 'ko-KR' ? 'en-US' : 'ko-KR'))}
              isListening=${voice.isListening}
              isTranscribing=${voice.isTranscribing}
              interimText=${voice.interimText}
              audioLevel=${voice.audioLevel}
              voiceError=${voice.voiceError}
              voiceEngineMode=${voice.engineMode}
              onToggleVoiceEngine=${() => voice.setEngineMode(voice.engineMode === 'speech' ? 'gemini-audio' : 'speech')}
              onToggleListening=${voice.toggleListening}
              objects=${objects}
              selectedObject=${selectedObject}
              onSelectObject=${(id) => {
                setSelectedId(id);
                if (id) setTimeout(() => viewportRef.current?.setCameraPreset('focus'), 30);
              }}
              onDeleteObject=${(id) => {
                pushHistorySnapshot(objects);
                setObjects((prev) => prev.filter((o) => o.id !== id));
              }}
              onDuplicateObject=${(id) => {
                const src = objects.find((o) => o.id === id);
                if (!src) return;
                pushHistorySnapshot(objects);
                const copy = cloneObjects([src])[0];
                copy.id = generateId('dup');
                copy.name = `${src.name} 복제`;
                copy.position = [src.position[0] + 1.2, src.position[1], src.position[2]];
                setObjects((prev) => [...prev, copy]);
                setSelectedId(copy.id);
              }}
              onToggleVisibility=${(id) => {
                pushHistorySnapshot(objects);
                setObjects((prev) => prev.map((o) => (o.id === id ? { ...o, visible: o.visible === false } : o)));
              }}
              onUpdateSelected=${(patch) => {
                if (!selectedId) return;
                pushHistorySnapshot(objects);
                setObjects((prev) => prev.map((o) => {
                  if (o.id !== selectedId) return o;
                  const nextMat = { ...o.material, ...(patch.color ? { color: patch.color } : {}), ...(patch.finish ? { finish: patch.finish } : {}) };
                  return {
                    ...o,
                    ...(patch.position ? { position: patch.position } : {}),
                    ...(patch.rotationDeg ? { rotationDeg: patch.rotationDeg } : {}),
                    ...(patch.scale ? { scale: patch.scale } : {}),
                    ...(o.shape === 'imported' && (patch.color || patch.finish) ? { overrideImportedMaterial: true } : {}),
                    material: nextMat,
                  };
                }));
              }}
              projectName=${projectName}
              onChangeProjectName=${setProjectName}
              canRedo=${redoStack.length > 0}
              onRedo=${handleRedo}
              onCapturePNG=${() => viewportRef.current?.exportPNG('vocacad-render.png')}
              onSaveProjectJSON=${() => {
                const blob = new Blob([JSON.stringify({ app: 'VocaCAD Studio', version: 1, name: projectName, objects, history }, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${projectName.replace(/\s+/g, '_')}.vocacad.json`;
                a.click();
                URL.revokeObjectURL(url);
              }}
              onResetScene=${() => {
                pushHistorySnapshot(objects);
                setObjects([]);
                setSelectedId(null);
              }}
              transformMode=${transformMode}
              onChangeTransformMode=${setTransformMode}
              onCameraPreset=${(p) => viewportRef.current?.setCameraPreset(p)}
              history=${history}
            />
          </div>
        `;
      }

      createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
  </body>
</html>
